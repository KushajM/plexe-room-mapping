.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}

.cases{display:grid;gap:18px}

.case-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.case-head h2{margin:0;font-size:19px}
.tag{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#f3eee8;border-radius:6px;padding:3px 9px}

.bad .icon{background:var(--red)}.good .icon{background:var(--green)}
.bad .say b{color:var(--red)}.good .say b{color:var(--green)}
.row{background:#fff;border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.good .row + .row{margin-top:8px}
.row-label{font-size:12px;color:var(--muted)}
.name{font-family:ui-monospace,Consolas,"SF Mono",monospace;font-size:14px;word-break:break-word}
mark{background:#fde68a;color:#3f3000;border-radius:3px;padding:0 3px}

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const BED = /\b(king|queen|twin|double|single)\b/gi;
const hl = s => esc(s).replace(BED, m => `<mark>${m}</mark>`);
const kinds = ["All", ...Array.from(new Set(D.cases.map(c => c.kind))).sort()];
let filter = "All";
function card(c) {
  const others = c.enc.filter(n => n !== c.a && n !== c.b);
  const more = c.enc_n - 2;
  return `<article class="case">
    <div class="case-head"><h2>${esc(c.hotel)}</h2><span class="tag">${esc(c.kind)}</span></div>
    ${c.site ? `<div class="site">The hotel's own website lists these as two rooms: ${esc(c.site[0])} and ${esc(c.site[1])}.</div>` : ""}
    <div class="vs">
      <div class="box bad">
        <div class="say"><span class="icon" aria-hidden="true">&#x2715;</span><span>Encoder + picker: <b>same row</b></span></div>
        <div class="row"><div class="name">${hl(c.a)}</div><div class="name">${hl(c.b)}</div></div>
        ${more > 0 ? `<details><summary>${more} other ${more === 1 ? "name" : "names"} in this row</summary><ul>${others.map(n => `<li>${hl(n)}</li>`).join("")}${c.enc_n > c.enc.length ? `<li>and ${c.enc_n - c.enc.length} more</li>` : ""}</ul></details>` : ""}
      </div>
      <div class="box good">
        <div class="say"><span class="icon" aria-hidden="true">&#x2713;</span><span>Plexe mapper: <b>separate rows</b></span></div>
        <div class="row"><div class="row-label">Row 1</div><div class="name">${hl(c.a)}</div></div>
        <div class="row"><div class="row-label">Row 2</div><div class="name">${hl(c.b)}</div></div>
      </div>
    </div></article>`;
}
function render() {
  document.getElementById("chips").innerHTML = kinds.map(k => `<button type="button" aria-pressed="${k === filter}" data-k="${esc(k)}">${esc(k === "All" ? "All cases" : k)}</button>`).join("");
  document.getElementById("cases").innerHTML = D.cases.filter(c => filter === "All" || c.kind === filter).map(card).join("");
}
document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { filter = b.dataset.k; render(); } });
render();
</script>
